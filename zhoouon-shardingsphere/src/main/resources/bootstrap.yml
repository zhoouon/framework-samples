server:
  port: 8089
spring:
  application:
    name: sharding-sphere
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: 59be4370-3745-47e6-b406-3d196ad5b2b6
        username: nacos
        password: nacos
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 59be4370-3745-47e6-b406-3d196ad5b2b6
        username: nacos
        password: nacos
#seata
seata:
  #事务分组 要和nacos seataServer.properties 中的service.vgroupMapping.default_tx_group 一致
  tx-service-group: default_tx_group
  registry:
    #配置seata的注册中心，告诉 seata client 怎么去访问seata service
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      #seata service 的 application: name
      application: seata-server
      username: nacos
      password: nacos
      group: SEATA_GROUP
  config:
    #配置seata的配置中心，可以读取关于seata client 的一些配置
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      group: SEATA_GROUP
      data-id: seataServer.properties

  profiles:
    active: dev

## mybatis-plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**.xml
  type-aliases-package: com.zhoouon.sharding.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # MyBatis 配置
    map-underscore-to-camel-case: true
    global-config:
      # 全局配置
      db-config:
        # 数据库配置
        id-type: auto
logging:
  level:
    org.apache.shardingsphere: debug
