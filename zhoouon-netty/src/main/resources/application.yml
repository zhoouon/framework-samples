server:
  port: 8708
spring:
  application:
    name: netty-application
  profiles:
    active: dev

## mybatis-plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**.xml
  type-aliases-package: com.zhoouon.sharding.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # MyBatis 配置
    map-underscore-to-camel-case: true
    global-config:
      # 全局配置
      db-config:
        # 数据库配置
        id-type: auto
logging:
  level:
    org.apache.shardingsphere: debug
