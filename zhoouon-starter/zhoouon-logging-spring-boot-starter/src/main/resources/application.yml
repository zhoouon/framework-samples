server:
  port: 8080

desense:
  # 字段名精确匹配（优先）
  keys:
    - phone
    - mobile
    - idCard
    - id_card
    - bankCard
    - bank_card
    - email
    - username

  # 自定义正则（按顺序应用）
  regex:
    - name: phone
      pattern: "(1\\d{2})\\d{4}(\\d{4})"
      replace: "$1****$2"
      dotall: true
    - name: idCard
      pattern: "(\\d{6})\\d{8}(\\w{4})"
      replace: "$1********$2"
      dotall: true
    - name: bankCard
      pattern: "(\\d{4})\\d+(\\d{4})"
      replace: "$1 **** **** $2"
      dotall: true
    - name: email
      pattern: "([a-zA-Z\\d._%+-])[a-zA-Z\\d._%+-]*@([a-zA-Z\\d.-]+)"
      replace: "$1**@$2"
      dotall: false

  # 可选：是否启用 Aho-Corasick 引擎（默认 false）
  enableAho: false

  # 运行时动态敏感词（也可以通过管理 API 修改）
  dynamicWords: []
